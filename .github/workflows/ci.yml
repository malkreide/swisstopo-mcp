name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Bringt die ruff- und mypy-Pins aus dem [dev]-Extra mit. Weiter unten
        # stand ein zweiter `pip install ruff==<version>`-Schritt, der nach
        # diesem lief und gegen pyproject gewann: den Pin dort zu aendern haette
        # in der CI nichts bewirkt. Die Versionen stehen nur noch in pyproject,
        # damit lokaler Lauf und Gate sich nicht ueber sie uneinig sein koennen.
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -m "not live"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      # Type gate for SDK-002: four handlers were annotated `-> str` while
      # returning ToolResponse and nothing caught it.
      - name: Type check
        run: mypy src/

      # SEC-022: a tool's name, description and input schema are what the client
      # approved. If any changes, tool-hashes.json goes stale and this fails, so
      # the change cannot reach a release without surfacing in review.
      - name: Tool-definition snapshot
        run: python scripts/snapshot_tool_hashes.py --check

      # SEC-021: the egress-proxy ACL is generated from ALLOWED_HOSTS, so the
      # network layer cannot drift from the code layer unnoticed.
      - name: Egress ACL snapshot
        run: python scripts/render_egress_acl.py --check

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
