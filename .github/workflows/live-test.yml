name: Live API tests

# Audit OPS-001. The `live` suite is excluded from CI on purpose — an upstream
# outage must not fail an unrelated PR. But excluded-and-never-run means an
# upstream contract change (a renamed attribute, a dropped field) surfaces as a
# user-facing bug rather than as a build failure. This runs it nightly instead.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the failure step to file the drift issue. Declared explicitly
      # rather than relying on the repository's default token scope, which can
      # be read-only — and which would only be discovered on a night when the
      # tests had already failed.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `continue-on-error` so the verdict step runs either way. The job turns
      # red further down, out of the classified result.
      - name: Run live tests
        id: suite
        continue-on-error: true
        run: |
          set +e
          pytest tests/ -m live -v \
            --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` knows red and not-red. A live run has three answers, and
      # the third is the one that matters: a failed `pip install`, a timeout or
      # a renamed marker are NOT the same as an upstream contract change — but
      # under `failure()` they look identical, and the issue below then names
      # three specific causes ("renamed attribute, dropped field, deviation
      # over one metre") for a run that never reached an upstream at all.
      #
      # The other direction is worse because it is silent: skip every test and
      # pytest exits 0, so a night on which nothing was measured looked exactly
      # like a night on which everything passed.
      - name: Classify the run
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.suite.outputs.pytest_exit }}
        run: |
          args=(live-report.xml)
          if [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      # The failure path only executes when something is already broken, so it
      # must not itself depend on anything that could be broken. It previously
      # used actions/github-script@v8: a third-party action whose tag resolution
      # is never exercised on a green run, so a bad pin would have failed
      # silently for exactly the reader who needed the report (audit OPS-001).
      # `gh` ships on the runner and needs no pin.
      - name: Report failure
        if: steps.verdict.outputs.state == 'finding'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The label has to exist before it can be used, on the repository as
          # well as on the issue: `gh issue create --label` on an unknown label
          # fails the whole call ("could not add label: not found"), which cost
          # a night's report even though the label was the only thing missing.
          # `--force` makes this idempotent, so it is safe to run every time.
          gh label create live-test-failure --force \
            --color B60205 \
            --description "Nightly live API suite failed against real upstreams"
          # Deduplicate: one open issue at a time, not one per night.
          if [ -n "$(gh issue list --label live-test-failure --state open --json number --jq '.[].number')" ]; then
            echo "An open live-test-failure issue already exists; not filing another."
            exit 0
          fi
          gh issue create \
            --title "Nightly live API tests failed" \
            --label live-test-failure \
            --body "$(cat <<EOF
          The nightly \`live\` suite failed against the real upstream APIs.

          This usually means one of:
          - an upstream contract change (renamed attribute, dropped field),
          - a transient upstream outage,
          - the polynomial-vs-REFRAME deviation exceeding one metre.

          Run: ${RUN_URL}
          EOF
          )"

      # Only here does the job turn red. `clear` is green; `finding` and
      # `unknown` are both red, but only `finding` filed an issue above — the
      # difference is in the log, not in the exit code.
      #
      # Through `env`, not `${{ }}` inside the script: the reason can carry a
      # parser message about someone else's file, and `${{ }}` substitutes it
      # into the shell verbatim before the shell starts.
      - name: Surface the verdict
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
