# Audit profile for swisstopo-mcp
# Re-audit 2026-07-27 (second run) after closing all 22 findings from run
# 2026-07-27T125314-Z. Profile otherwise unchanged.
# Updated vs. the 2026-05-29 profile: deployment now includes container/K8s
# artifacts (Dockerfile + deploy/kubernetes.yaml), which were added as
# remediation for SEC-007 / SCALE-002 *after* that profile was written.
# is_cloud_deployed flipped to true accordingly — this widens applicability,
# which is the conservative choice for a re-audit.
name: swisstopo-mcp
repo: https://github.com/malkreide/swisstopo-mcp
prio: 0

sdk_language: Python

# stdio by default (mcp.run()); `--http` runs streamable-http via uvicorn.
transport: dual

# All upstreams are public/keyless (geo.admin.ch, REFRAME, STAC, cantonal
# OEREB, geodienste.ch, Overpass, OpenPLZ). No API key, no OAuth proxy.
auth_model: none

data_class: Public Open Data

# All 24 tools carry readOnlyHint=True / destructiveHint=False.
write_capable: false

deployment: [local-stdio, andere]
is_cloud_deployed: true

uses_sampling: false
uses_sequential_thinking: false
tools_include_filesystem: false
tools_make_external_requests: true

stadt_zuerich_context: false
schulamt_context: false
volksschule_context: false
enterprise_context: false

data_source:
  is_swiss_open_data: true
