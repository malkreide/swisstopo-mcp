# HAProxy configuration for horizontally scaled swisstopo-mcp (audit SCALE-003).
#
# Streamable-HTTP sessions are held in the process that created them, so a
# request carrying an Mcp-Session-Id must reach the same replica. Round-robin
# alone breaks every multi-request session above one replica.
#
# Mount at /usr/local/etc/haproxy/haproxy.cfg, or adapt the backend block into
# the haproxy-ingress ConfigMap. It pairs with deploy/statefulset.yaml, which
# provides the stable per-pod DNS names the `server-template` below resolves.
#
# WHAT WAS WRONG WITH THE PREVIOUS VERSION, because it looked correct and was
# not: `stick on <pattern>` is shorthand for `stick match` + `stick
# store-REQUEST`. The MCP session id is minted by the *server* and returned in
# the response to `initialize` — verified at runtime, that request carries no
# Mcp-Session-Id at all. So nothing was ever stored. The client's next request
# was the first to carry the header, missed the empty table, got round-robined
# to a replica that with two servers is the wrong one half the time, and was
# then pinned there for the full hour. The missing line is `stick
# store-response`, which is the canonical HAProxy pattern for a
# server-generated identifier.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode                http
    log                 global
    option              httplog
    timeout connect     5s
    timeout client      120s
    # Streamable-HTTP holds a long-lived response stream; a short server
    # timeout would sever it mid-session.
    timeout server      120s
    timeout tunnel      1h

# Kubernetes cluster DNS. Without a resolvers section HAProxy resolves server
# names once at startup and refuses to start if any is unresolvable — which is
# exactly what happens while a StatefulSet is still scaling up.
resolvers kube-dns
    nameserver dns1 kube-dns.kube-system.svc.cluster.local:53
    resolve_retries       3
    timeout resolve       1s
    timeout retry         1s
    hold valid            10s
    hold other            30s
    hold refused          30s
    hold nx               30s
    hold timeout          30s

frontend mcp_frontend
    bind :8080
    default_backend mcp_backend

backend mcp_backend
    balance roundrobin

    # Stick-table rather than cookies: MCP clients are not browsers and will
    # not carry one. 100k entries at a 1h idle expiry.
    stick-table type string len 64 size 100k expire 1h

    # LEARN the mapping from the response that mints the session id …
    stick store-response res.hdr(Mcp-Session-Id)
    # … and USE it on every subsequent request that carries the header.
    stick match req.hdr(Mcp-Session-Id)

    # /healthz answers regardless of transport-security config, which makes it
    # a liveness probe — not a proof that MCP requests succeed. See
    # docs/deployment.md on SWISSTOPO_ALLOWED_HOSTS.
    option httpchk GET /healthz
    http-check expect status 200

    # Stable per-pod DNS from the headless Service in deploy/statefulset.yaml.
    # `server-template` plus `resolvers` means pods that do not exist yet are
    # simply DOWN rather than a startup failure.
    server-template mcp 3 _mcp._tcp.swisstopo-mcp-headless.default.svc.cluster.local \
        check resolvers kube-dns init-addr none
