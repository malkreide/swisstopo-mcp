# HAProxy configuration for horizontally scaled swisstopo-mcp (audit SCALE-003).
#
# Streamable-HTTP sessions are held in the process that created them, so a
# request carrying an Mcp-Session-Id must reach the same replica. Round-robin
# alone breaks every multi-request session above one replica.
#
# This file was previously a commented sketch inside the Ingress manifest,
# which is not deployable. It is now a real config: mount it at
# /usr/local/etc/haproxy/haproxy.cfg, or adapt the backend block into the
# haproxy-ingress ConfigMap.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode                http
    log                 global
    option              httplog
    timeout connect     5s
    timeout client      120s
    # Streamable-HTTP holds a long-lived response stream; a short server
    # timeout would sever it mid-session.
    timeout server      120s
    timeout tunnel      1h

frontend mcp_frontend
    bind :8080
    default_backend mcp_backend

backend mcp_backend
    balance roundrobin

    # Route on the session header the MCP transport already sets. Stick-table
    # rather than cookies: MCP clients are not browsers and will not carry one.
    stick-table type string len 64 size 100k expire 1h
    stick on req.hdr(Mcp-Session-Id)

    # /healthz answers regardless of transport-security config, which makes it
    # a liveness probe — not a proof that MCP requests succeed. See
    # docs/deployment.md on SWISSTOPO_ALLOWED_HOSTS.
    option httpchk GET /healthz
    http-check expect status 200

    server mcp1 swisstopo-mcp-1:8000 check
    server mcp2 swisstopo-mcp-2:8000 check
