# NGINX cookie affinity for BROWSER clients only (audit SCALE-002).
#
# THIS IS NOT THE GENERAL MULTI-REPLICA PATH. NGINX cannot stick on an arbitrary
# request header, so it pins clients with an affinity cookie — and MCP hosts
# such as Claude Desktop or mcp-remote are not browsers and do not persist
# cookies. For everything except a browser-based client this manifest provides
# no affinity at all.
#
# The supported path is HAProxy affinity on Mcp-Session-Id:
#   deploy/haproxy.cfg + deploy/statefulset.yaml + deploy/haproxy-deployment.yaml
# See docs/deployment.md, "Scaling out".
#
# This file previously carried a commented HAProxy snippet as "Option A
# (preferred)". That snippet used `stick on req.hdr(Mcp-Session-Id)`, which
# never populates the stick-table — the session id is minted in the *response*
# to initialize, so there is nothing to store on the request. It has been
# removed rather than corrected: the working config belongs in one place
# (deploy/haproxy.cfg), and duplicating it is how the same error came to exist
# in three files (audit `2026-07-27T162602-Z`, SCALE-003).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swisstopo-mcp
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "swisstopo-mcp-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Strict"
spec:
  ingressClassName: nginx
  rules:
    - host: swisstopo-mcp.example.com # <-- replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swisstopo-mcp
                port:
                  number: 80

# ---------------------------------------------------------------------------
# A shared session store (e.g. Redis) would remove the affinity requirement
# entirely and also survive pod loss, which affinity does not. It needs a
# SessionManager wired into FastMCP and is not implemented.
# ---------------------------------------------------------------------------
